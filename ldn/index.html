treet, London, W1D 6DJ","lat":51.5118,"lng":-0.1328,"coordsVerified":true,"why":"A 12-seat basement counter beneath a Soho pub serving a seasonal, Michelin-starred tasting menu prepared directly in front of diners.","priceBand":"££££","url":"https://theblueposts.co.uk/evelyns-table/","tier":"evergreen"}],"sources":{"comedy-clubs":[],"music-venues":[],"listening-bars":[],"theatre":[],"art-museums":[],"cocktail-bars":[],"cinemas":[],"immersive":[],"supper-clubs":[]},"verified":true};</script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
  (function () {
    var state = { data: null, tier: 'all', cats: new Set(), active: null, locked: false };
    var map, marker, mapReady = false, hideTimer = null;

    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function catById(id){ return state.data.categories.find(function(c){return c.id===id;}); }
    function hexA(hex, a){ var h=hex.replace('#',''); if(h.length===3) h=h.split('').map(function(x){return x+x;}).join(''); var n=parseInt(h,16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
    function monthLabel(tag){ if(!tag) return ''; var p=String(tag).split('-'); if(p.length<2) return tag; var m=['January','February','March','April','May','June','July','August','September','October','November','December']; return (m[+p[1]-1]||'')+' '+p[0]; }

    function boot(data) {
      state.data = data;
      state.cats = new Set(data.categories.map(function(c){return c.id;}));
      document.getElementById('month').textContent = monthLabel(data.month);
      renderChips(); renderFoot(); render();
      bindControls(); bindMapcard();
    }

    function bindControls(){
      document.getElementById('all-cats').onclick=function(){ state.cats=new Set(state.data.categories.map(function(c){return c.id;})); syncChips(); render(); };
      document.getElementById('no-cats').onclick=function(){ state.cats=new Set(); syncChips(); render(); };
      document.querySelectorAll('.seg button').forEach(function(btn){
        btn.onclick=function(){ state.tier=btn.dataset.tier; document.querySelectorAll('.seg button').forEach(function(x){x.setAttribute('aria-pressed', x===btn);}); render(); };
      });
    }

    function renderChips(){
      var wrap=document.getElementById('chips'); wrap.innerHTML='';
      state.data.categories.forEach(function(c){
        var n=state.data.places.filter(function(p){return p.category===c.id;}).length;
        var b=document.createElement('button');
        b.className='chip'; b.setAttribute('aria-pressed','true'); b.dataset.cat=c.id;
        b.innerHTML='<span class="dot" style="background:'+c.color+'"></span>'+esc(c.short||c.label)+' <span class="n">'+n+'</span>';
        b.onclick=function(){ if(state.cats.has(c.id)) state.cats.delete(c.id); else state.cats.add(c.id); syncChips(); render(); };
        wrap.appendChild(b);
      });
    }
    function syncChips(){ document.querySelectorAll('.chip').forEach(function(b){ b.setAttribute('aria-pressed', state.cats.has(b.dataset.cat)); }); }

    function visible(p){ if(!state.cats.has(p.category)) return false; if(state.tier==='all') return true; return p.tier===state.tier; }

    var PINSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';

    function render(){
      var root=document.getElementById('content'); root.innerHTML=''; var any=false;
      state.data.categories.forEach(function(c){
        var ps=state.data.places.filter(function(p){return p.category===c.id && visible(p);}).sort(function(a,b){return a.rank-b.rank;});
        if(!ps.length) return; any=true;
        var sec=document.createElement('section'); sec.className='section';
        var head=document.createElement('div'); head.className='sec-head';
        head.innerHTML='<span class="bar" style="background:'+c.color+'"></span><h2>'+esc(c.label)+'</h2><span class="blurb">'+esc(c.blurb||'')+'</span>';
        sec.appendChild(head);
        var grid=document.createElement('div'); grid.className='grid';
        ps.forEach(function(p){ grid.appendChild(cardEl(p,c)); });
        sec.appendChild(grid); root.appendChild(sec);
      });
      if(!any) root.innerHTML='<div class="empty">Nothing matches those filters.</div>';
    }

    function cardEl(p,c){
      var el=document.createElement('button'); el.type='button'; el.className='card'+(state.active===p.id?' active':''); el.dataset.id=p.id; el.style.setProperty('--cat', c.color);
      var tm = p.thisMonth ? '<div class="tm" style="background:'+hexA(c.color,.1)+';color:'+c.color+'"><b>'+esc(p.thisMonth.dates||'This month')+'</b> — '+esc(p.thisMonth.headline||'')+'</div>' : '';
      var visit = p.url ? '<a class="visit" style="color:'+c.color+'" href="'+esc(p.url)+'" target="_blank" rel="noopener">Visit &rsaquo;</a>' : '<span></span>';
      el.innerHTML =
        '<div class="top"><span class="rank" style="background:'+c.color+'">'+p.rank+'</span>'
        + '<span class="name">'+esc(p.name)+'</span></div>'
        + '<div class="meta"><span>'+esc(p.area)+'</span>'+(p.priceBand?'<span class="price">'+esc(p.priceBand)+'</span>':'')+(p.tier==='this-month'?'<span class="on" style="color:'+c.color+'">● on now</span>':'')+'</div>'
        + '<div class="why">'+esc(p.why)+'</div>'+tm
        + '<div class="foot"><span class="pin-hint" style="color:'+c.color+'">'+PINSVG+' Map</span>'+visit+'</div>';
      // hover = preview, click = lock
      el.addEventListener('mouseenter', function(){ if(!state.locked) showPlace(p, false); });
      el.addEventListener('mouseleave', function(){ if(!state.locked) scheduleHide(); });
      el.addEventListener('click', function(e){ if(e.target.closest('.visit')) return; showPlace(p, true); });
      el.addEventListener('focus', function(){ showPlace(p, false); });
      return el;
    }

    function ensureMap(){
      if(mapReady) return;
      map = L.map('map', { zoomControl: true, scrollWheelZoom: false, attributionControl: true }).setView([51.5085,-0.1257], 13);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap &copy; CARTO' }).addTo(map);
      mapReady = true;
    }

    function showPlace(p, lock){
      clearTimeout(hideTimer);
      state.active = p.id; state.locked = lock || state.locked && false; if(lock) state.locked = true;
      document.querySelectorAll('.card').forEach(function(el){ el.classList.toggle('active', el.dataset.id===p.id); });
      var c = catById(p.category) || { color:'#666', label:'' };
      document.getElementById('mc-cat').textContent = c.label; document.getElementById('mc-cat').style.color = c.color;
      document.getElementById('mc-name').textContent = p.name;
      document.getElementById('mc-meta').textContent = [p.area, p.priceBand].filter(Boolean).join(' · ');
      var tm = p.thisMonth ? '<div style="margin-bottom:6px;color:'+c.color+';font-weight:600;font-size:11px">'+esc(p.thisMonth.dates||'')+' — '+esc(p.thisMonth.headline||'')+'</div>' : '';
      var link = p.url ? '<a href="'+esc(p.url)+'" target="_blank" rel="noopener" style="color:'+c.color+'">Visit site &rsaquo;</a>' : '';
      document.getElementById('mc-foot').innerHTML = tm + '<div class="why">'+esc(p.why)+'</div>' + link;
      var mc = document.getElementById('mapcard'); mc.classList.add('show');
      ensureMap();
      if(p.lat!=null && p.lng!=null){
        map.setView([p.lat,p.lng], 15, { animate: true });
        if(marker) map.removeLayer(marker);
        var icon = L.divIcon({ className:'marker', html:'<div class="pin" style="background:'+c.color+'"><span>'+p.rank+'</span></div>', iconSize:[30,30], iconAnchor:[15,29] });
        marker = L.marker([p.lat,p.lng], { icon: icon }).addTo(map);
      }
      setTimeout(function(){ if(mapReady) map.invalidateSize(); }, 60);
    }

    function scheduleHide(){ clearTimeout(hideTimer); hideTimer=setTimeout(hideMap, 260); }
    function hideMap(){ if(state.locked) return; document.getElementById('mapcard').classList.remove('show'); state.active=null; document.querySelectorAll('.card.active').forEach(function(el){el.classList.remove('active');}); }

    function bindMapcard(){
      var mc=document.getElementById('mapcard');
      mc.addEventListener('mouseenter', function(){ clearTimeout(hideTimer); });
      mc.addEventListener('mouseleave', function(){ if(!state.locked) scheduleHide(); });
      document.getElementById('mc-close').onclick=function(){ state.locked=false; document.getElementById('mapcard').classList.remove('show'); state.active=null; document.querySelectorAll('.card.active').forEach(function(el){el.classList.remove('active');}); };
    }

    function renderFoot(){
      var d=state.data;
      document.getElementById('foot').innerHTML='Curated by grounded AI research (Gemini 3.5 · Google Search), independently fact-checked. Data for '+esc(monthLabel(d.month))+(d.generatedAt?', generated '+esc(String(d.generatedAt).slice(0,10)):'')+'. Hover or tap a card to place it on the map. Details change — confirm with the venue before you go.';
    }

    // Load: window.__LIVE__ null=seed-only, string=fetch that, undefined=default /api/data
    function useSeed(){ if(window.__SEED__) boot(window.__SEED__); else document.getElementById('content').innerHTML='<div class="empty">Could not load data.</div>'; }
    var LIVE = (window.__LIVE__ === undefined) ? '/api/data' : window.__LIVE__;
    if(!LIVE){ useSeed(); }
    else { fetch(LIVE, { cache:'no-store' }).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(boot).catch(useSeed); }
  })();
  </script>
</body>
</html>
