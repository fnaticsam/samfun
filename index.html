<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>sam.toys — things I build</title>
<style>
  :root{
    --bg:#0b0b0f; --card:#15151c; --card-hi:#1d1d27; --line:#26262f;
    --text:#f0efe9; --dim:#9a99a6; --accent:#ffb454; --accent-2:#8b7cff;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(255,180,84,.10), transparent 60%),
      radial-gradient(900px 500px at 90% 0%, rgba(139,124,255,.10), transparent 55%),
      var(--bg);
    color:var(--text); min-height:100dvh;
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto;padding:64px 20px 80px}
  @media (max-width:640px){.wrap{padding:44px 16px 60px}}

  header{margin-bottom:14px}
  .mark{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .mark .dot{color:var(--accent)}
  .tag{color:var(--dim);font-size:17px;margin-top:12px;max-width:46ch}
  .tag b{color:var(--text);font-weight:600}

  h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
    font-weight:700;margin:48px 0 16px}

  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .card{
    position:relative;display:flex;flex-direction:column;gap:6px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 16px;text-decoration:none;color:inherit;
    transition:transform .16s ease,border-color .16s ease,background .16s ease;
    overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--dot,var(--accent));opacity:.85}
  .card:hover{transform:translateY(-3px);background:var(--card-hi);border-color:#37363f}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card .name{font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .card .desc{color:var(--dim);font-size:14px;flex:1}
  .card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .card .host{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .card .arrow{color:var(--dim);transition:transform .16s ease}
  .card:hover .arrow{transform:translate(2px,-2px);color:var(--text)}
  .badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 7px;border-radius:999px;border:1px solid currentColor}
  .badge.new{color:var(--accent)}
  .badge.lock{color:var(--accent-2)}

  @media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}

  footer{margin-top:56px;color:var(--dim);font-size:13px;line-height:1.7}
  footer a{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">sam<span class="dot">.</span>toys</div>
    <p class="tag"><b>Things I build.</b> Little tools, weekend experiments, and a few that grew up.</p>
  </header>

  <h2>Toys &amp; experiments</h2>
  <div class="grid" id="toys"></div>

  <h2>Bigger builds</h2>
  <div class="grid" id="products"></div>

  <footer>
    Made by Sam. Some of these are just for me — say hi if one’s useful.
  </footer>
</div>

<script>
(function(){
  // Curated from Cod's showcase (2026-07-16). Edit here to add/remove.
  var TOYS=[
    {name:"Tracks", desc:"Buy what you stream, find what you spin — Spotify to Beatport & back.", url:"/tracks", host:"sam.toys/tracks", dot:"#01ff95", badge:"new", internal:true},
    {name:"Voicenotes", desc:"Drop a WhatsApp voice note, get the gist in bullets.", url:"/voicenotes", host:"sam.toys/voicenotes", dot:"#25d366", internal:true},
    {name:"Taotime", desc:"The Watercourse Way — Tao, the I Ching, and daily stillness.", url:"https://taotime.me", host:"taotime.me", dot:"#7fb2d9"},
    {name:"Hike Fan", desc:"Find your next hike in Ibiza.", url:"https://hike.fan", host:"hike.fan", dot:"#8ec06c"},
    {name:"Finca", desc:"Browse beautiful Ibiza homes.", url:"https://finca.fan", host:"finca.fan", dot:"#d9a441"},
    {name:"The Brief Brief", desc:"Your world, briefed by AI every morning.", url:"https://tbb.ceo", host:"tbb.ceo", dot:"#ffb454"},
    {name:"Tantra", desc:"The Loom of Union — a tantra journey in ink & gold.", url:"/tantra", host:"sam.toys/tantra", dot:"#c9a227", internal:true},
    {name:"INZONE Sweeps", desc:"Fnatic × Sony — Road to Tokyo sweepstakes demo.", url:"https://fnatic-inzone-sweeps.vercel.app", host:"fnatic-inzone-sweeps", dot:"#ff5900"}
  ];
  var PRODUCTS=[
    {name:"TradeGG", desc:"Options-trading dashboard with research, pricing & a masterclass.", url:"https://trd.fun", host:"trd.fun", dot:"#22c55e"},
    {name:"DrFit", desc:"Your pocket AI fitness coach.", url:"https://drfit.tips", host:"drfit.tips", dot:"#38bdf8"},
    {name:"Drift & Sea", desc:"Ibiza property stays, done properly.", url:"https://driftsea.co", host:"driftsea.co", dot:"#e0c9a6"},
    {name:"Seer", desc:"AI League of Legends draft & post-game coaching.", url:"https://seer.coach", host:"seer.coach", dot:"#8b7cff", badge:"lock"}
  ];
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function badgeHtml(b){ if(b==="new")return '<span class="badge new">new</span>'; if(b==="lock")return '<span class="badge lock">invite</span>'; return ''; }
  function render(id, items){
    var frag=document.createDocumentFragment();
    items.forEach(function(it){
      var a=document.createElement('a');
      a.className='card'; a.href=it.url; a.style.setProperty('--dot', it.dot||'var(--accent)');
      if(!it.internal){ a.target='_blank'; a.rel='noopener noreferrer'; }
      a.innerHTML=
        '<div class="name">'+esc(it.name)+' '+badgeHtml(it.badge)+'</div>'+
        '<div class="desc">'+esc(it.desc)+'</div>'+
        '<div class="foot"><span class="host">'+esc(it.host)+'</span><span class="arrow">↗</span></div>';
      frag.appendChild(a);
    });
    document.getElementById(id).appendChild(frag);
  }
  render('toys', TOYS);
  render('products', PRODUCTS);
})();
</script>
</body>
</html>
